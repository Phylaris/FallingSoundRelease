# 构建源码仓库（Phylaris/FallingSound）最新版本的各平台构件，并发布到本仓库（FallingSoundRelease）的 Release
#
# 触发方式: 仅手动触发（workflow_dispatch），本仓库的 tag 推送不触发
#
# 执行逻辑:
#   1. 从源码仓库 FallingSound 获取最新 Release 的 tag（无 Release 则取最新 tag，
#      两者都没有则回退 main 分支 + 版本号 0.1.0-SNAPSHOT）
#   2. 按该 tag 检出源码并构建 Android / iOS / macOS / Windows / Linux 构件
#   3. build-ios-ipa.sh 位于源码仓库（FallingSound），checkout 后直接使用
#   4. 版本号通过环境变量 VERSION 暴露，并以 -Pversion=<版本号> 传入 Gradle，
#      同时通过 GRADLE_OPTS=-Dorg.gradle.project.version=<版本号> 覆盖 xcodebuild
#      子进程的 gradlew 调用；源码侧可用
#      providers.gradleProperty("version").getOrElse("0.1.0-SNAPSHOT") 读取
#   5. 先按源码版本号在本仓库创建 Release（已存在则跳过；源码仓库无 Release/tag 时不创建）
#   6. 各平台构建完成后立即将构件上传到本仓库 Release，无需等待其他平台
#
# 前置条件:
#   1. 本仓库 Settings → Secrets and variables → Actions → 新建仓库密钥 GH_PAT
#      值为有 FallingSound 仓库读取权限的 Personal Access Token
#   2. 本仓库 Settings → Actions → General → Workflow permissions
#      设为 "Read and write permissions"（GITHUB_TOKEN 才能创建 Release）

name: Build FallingSound & Release

on:
  workflow_dispatch:

permissions:
  contents: write

env:
  SOURCE_REPO: Phylaris/FallingSound      # 源码所在私有仓库

jobs:
  resolve-version:
    name: Resolve source version
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
      version: ${{ steps.resolve.outputs.version }}
    steps:
      - name: Get latest release or tag from source repo
        id: resolve
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          TAG=""
          VERSION=""
          # 优先取最新 Release 的 tag
          TAG=$(gh release view --repo "${{ env.SOURCE_REPO }}" --json tagName --jq .tagName 2>/dev/null || true)
          # 无 Release 时取最新 tag
          if [ -z "$TAG" ]; then
            TAG=$(gh api "repos/${{ env.SOURCE_REPO }}/tags" --jq '.[0].name' 2>/dev/null || true)
          fi
          # 两者都没有则回退默认分支，版本号与源码侧默认值保持一致
          if [ -z "$TAG" ]; then
            TAG="main"
            VERSION="0.1.0-SNAPSHOT"
          else
            VERSION="${TAG#v}"
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

  create-release:
    name: Create GitHub Release
    needs: resolve-version
    runs-on: ubuntu-latest
    steps:
      # 先行创建 Release（发布到本仓库，幂等：已存在则跳过）；
      # 源码仓库无 Release/tag（TAG=main）时不创建，仅空跑保证依赖它的构建 job 不被 skip
      - name: Create release on this repo if not exists
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ needs.resolve-version.outputs.tag }}"
          VERSION="${{ needs.resolve-version.outputs.version }}"
          if [ "$TAG" = "main" ]; then
            echo "源码仓库无 Release/tag，本次仅构建（版本 ${VERSION}），不创建 Release"
            exit 0
          fi
          if gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "Release $TAG 已存在，跳过创建"
          else
            gh release create "$TAG" \
              --title "FallingSound $VERSION" \
              --generate-notes \
              --repo "${{ github.repository }}"
          fi

  android:
    name: Android APK
    needs: [resolve-version, create-release]
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.resolve-version.outputs.version }}
    steps:
      - name: Checkout source repo at resolved version
        uses: actions/checkout@v4
        with:
          repository: ${{ env.SOURCE_REPO }}
          ref: ${{ needs.resolve-version.outputs.tag }}
          token: ${{ secrets.GH_PAT }}
          path: source

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: android-${{ hashFiles('source/**/*.gradle.kts', 'source/gradle/libs.versions.toml', 'source/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: android-

      # 签名配置通过 Gradle init script（-I 参数）注入，不修改源码仓库的构建脚本；
      # keystore 不存入源码仓库，由 KEYSTORE_BASE64 secret 解码生成（更安全），
      # 凭据齐全且 keystore 可用时才签名，否则构建未签名 APK
      - name: Decode signing keystore
        working-directory: source
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > see.jks
            ls -l see.jks
          else
            echo "未配置 KEYSTORE_BASE64，跳过 keystore 解码（将构建未签名 APK）"
          fi

      - name: Build release APK (signed if secrets configured)
        working-directory: source
        shell: bash
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          cat > signing.init.gradle <<'EOF'
          allprojects { p ->
              p.plugins.withId("com.android.application") {
                  def storePass = System.getenv("KEYSTORE_PASSWORD")
                  def alias = System.getenv("KEY_ALIAS")
                  def keyPass = System.getenv("KEY_PASSWORD")
                  // p.file() 相对 composeApp 项目目录解析，必须用 rootProject 定位仓库根目录的 keystore
                  def ksFile = p.rootProject.file(System.getenv("KEYSTORE_PATH") ?: "see.jks")
                  if (storePass && alias && keyPass && ksFile.exists()) {
                      p.android {
                          signingConfigs {
                              release {
                                  storeFile ksFile
                                  storePassword storePass
                                  keyAlias alias
                                  keyPassword keyPass
                              }
                          }
                          buildTypes {
                              release {
                                  signingConfig signingConfigs.getByName("release")
                              }
                          }
                      }
                  } else {
                      logger.lifecycle("签名凭据或 keystore 缺失，本次构建未签名 APK")
                  }
              }
          }
          EOF
          ./gradlew -I signing.init.gradle -Pversion="$VERSION" :composeApp:assembleRelease --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: source/composeApp/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Upload APK to GitHub Release
        if: needs.resolve-version.outputs.tag != 'main'
        working-directory: source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ needs.resolve-version.outputs.tag }}" \
            composeApp/build/outputs/apk/release/*.apk \
            --repo "${{ github.repository }}" --clobber

  ios-ipa:
    name: iOS IPA (unsigned)
    needs: [resolve-version, create-release]
    runs-on: macos-latest
    env:
      # xcodebuild 阶段会内部调用 ./gradlew :composeApp:embedAndSignAppleFrameworkForXcode，
      # 无法追加命令行参数，通过 GRADLE_OPTS 系统属性把版本号注入 Gradle project property
      GRADLE_OPTS: -Dorg.gradle.project.version=${{ needs.resolve-version.outputs.version }}
    steps:
      - name: Checkout source repo at resolved version
        uses: actions/checkout@v4
        with:
          repository: ${{ env.SOURCE_REPO }}
          ref: ${{ needs.resolve-version.outputs.tag }}
          token: ${{ secrets.GH_PAT }}
          path: source

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Cache Gradle & Konan
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.konan
          key: ios-${{ hashFiles('source/**/*.gradle.kts', 'source/gradle/libs.versions.toml', 'source/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: ios-

      - name: Build unsigned IPA
        working-directory: source
        run: |
          chmod +x build-ios-ipa.sh
          ./build-ios-ipa.sh Release

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: ios-ipa
          path: source/FallKmp.ipa
          if-no-files-found: error

      - name: Upload IPA to GitHub Release
        if: needs.resolve-version.outputs.tag != 'main'
        working-directory: source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ needs.resolve-version.outputs.tag }}" \
            FallKmp.ipa \
            --repo "${{ github.repository }}" --clobber

  windows:
    name: Windows EXE
    needs: [resolve-version, create-release]
    runs-on: windows-latest
    env:
      VERSION: ${{ needs.resolve-version.outputs.version }}
    steps:
      - name: Checkout source repo at resolved version
        uses: actions/checkout@v4
        with:
          repository: ${{ env.SOURCE_REPO }}
          ref: ${{ needs.resolve-version.outputs.tag }}
          token: ${{ secrets.GH_PAT }}
          path: source

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: windows-${{ hashFiles('source/**/*.gradle.kts', 'source/gradle/libs.versions.toml', 'source/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: windows-

      - name: Verify WiX environment
        shell: pwsh
        run: |
          Write-Host "===== PATH 中的 WiX 工具 ====="
          $candle = Get-Command candle.exe -ErrorAction SilentlyContinue
          if ($candle) {
            Write-Host "candle: $($candle.Source)"
            & $candle.Source -? 2>&1 | Select-Object -First 3
          } else {
            Write-Host "PATH 中未找到 candle.exe"
          }
          Write-Host "===== ~/.gradle/compose-jb 缓存 ====="
          Get-ChildItem "$env:USERPROFILE\.gradle\compose-jb" -ErrorAction SilentlyContinue | Select-Object Name, Length

      # 注意：Windows runner 默认 PowerShell，环境变量需用 $env:VERSION（$VERSION 会展开为空）
      # 注意：不能使用 cmd 风格 || { ... } 失败处理（PowerShell 7 下 script block 不会执行，只会回显文本），
      #       失败日志改由下方 if: failure() 独立步骤打印并上传 artifact
      - name: Build EXE installer
        working-directory: source
        run: ./gradlew.bat -Pversion="$env:VERSION" :composeApp:packageExe --no-daemon

      - name: Print jpackage logs on failure
        if: failure()
        shell: pwsh
        working-directory: source
        run: |
          Write-Host "===== jpackage args.txt ====="
          Get-Content composeApp/build/compose/tmp/packageExe.args.txt -ErrorAction SilentlyContinue
          Write-Host "===== jpackage 日志 ====="
          Get-ChildItem composeApp/build/compose/logs/packageExe/*-err.txt, composeApp/build/compose/logs/packageExe/*-out.txt -ErrorAction SilentlyContinue | ForEach-Object {
            Write-Host "----- $($_.Name) -----"
            Get-Content $_.FullName
          }

      - name: Upload jpackage logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: jpackage-logs
          path: |
            source/composeApp/build/compose/logs/packageExe/
            source/composeApp/build/compose/tmp/packageExe.args.txt
          if-no-files-found: warn

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: windows-exe
          path: source/composeApp/build/compose/binaries/main/exe/*.exe
          if-no-files-found: error

      # Windows runner 默认 PowerShell 不展开 glob，上传步骤显式用 bash
      - name: Upload EXE to GitHub Release
        if: needs.resolve-version.outputs.tag != 'main'
        shell: bash
        working-directory: source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ needs.resolve-version.outputs.tag }}" \
            composeApp/build/compose/binaries/main/exe/*.exe \
            --repo "${{ github.repository }}" --clobber

  dmg:
    name: macOS DMG (${{ matrix.arch }})
    needs: [resolve-version, create-release]
    strategy:
      matrix:
        include:
          - arch: arm64
            runner: macos-latest
          # macos-13 已于 2025-12 退役无法调度；x64 改用 macOS 26 (Tahoe) Intel 标准 runner
          - arch: x64
            runner: macos-26-intel
    runs-on: ${{ matrix.runner }}
    env:
      VERSION: ${{ needs.resolve-version.outputs.version }}
    steps:
      - name: Checkout source repo at resolved version
        uses: actions/checkout@v4
        with:
          repository: ${{ env.SOURCE_REPO }}
          ref: ${{ needs.resolve-version.outputs.tag }}
          token: ${{ secrets.GH_PAT }}
          path: source

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: macos-${{ matrix.arch }}-${{ hashFiles('source/**/*.gradle.kts', 'source/gradle/libs.versions.toml', 'source/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: macos-${{ matrix.arch }}-

      # 未配置开发者证书时 jpackage 生成未签名 DMG（与 iOS 未签名 IPA 同理）
      - name: Build DMG
        working-directory: source
        run: ./gradlew -Pversion="$VERSION" :composeApp:packageDmg --no-daemon

      - name: Print jpackage logs on failure
        if: failure()
        shell: bash
        working-directory: source
        run: |
          echo "===== createDistributable/packageDmg args ====="
          cat composeApp/build/compose/tmp/createDistributable.args.txt 2>/dev/null || true
          cat composeApp/build/compose/tmp/packageDmg.args.txt 2>/dev/null || true
          echo "===== jpackage 日志 ====="
          cat composeApp/build/compose/logs/createDistributable/*-err.txt 2>/dev/null || true
          cat composeApp/build/compose/logs/createDistributable/*-out.txt 2>/dev/null || true
          cat composeApp/build/compose/logs/packageDmg/*-err.txt 2>/dev/null || true
          cat composeApp/build/compose/logs/packageDmg/*-out.txt 2>/dev/null || true

      - name: Upload jpackage logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: macos-jpackage-logs
          path: |
            source/composeApp/build/compose/logs/createDistributable/
            source/composeApp/build/compose/logs/packageDmg/
            source/composeApp/build/compose/tmp/createDistributable.args.txt
            source/composeApp/build/compose/tmp/packageDmg.args.txt
          if-no-files-found: warn

      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: macos-dmg-${{ matrix.arch }}
          path: source/composeApp/build/compose/binaries/main/dmg/*.dmg
          if-no-files-found: error

      # 两架构生成的 dmg 同名，上传前重命名加入架构后缀避免冲突
      - name: Upload DMG to GitHub Release
        if: needs.resolve-version.outputs.tag != 'main'
        working-directory: source/composeApp/build/compose/binaries/main/dmg
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          DMG=$(ls *.dmg | head -n 1)
          mv "$DMG" "FallingSound-${{ needs.resolve-version.outputs.version }}-macos-${{ matrix.arch }}.dmg"
          gh release upload "${{ needs.resolve-version.outputs.tag }}" ./*.dmg \
            --repo "${{ github.repository }}" --clobber

  linux:
    name: Linux DEB
    needs: [resolve-version, create-release]
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.resolve-version.outputs.version }}
    steps:
      - name: Checkout source repo at resolved version
        uses: actions/checkout@v4
        with:
          repository: ${{ env.SOURCE_REPO }}
          ref: ${{ needs.resolve-version.outputs.tag }}
          token: ${{ secrets.GH_PAT }}
          path: source

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: linux-${{ hashFiles('source/**/*.gradle.kts', 'source/gradle/libs.versions.toml', 'source/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: linux-

      - name: Build DEB installer
        working-directory: source
        run: |
          ./gradlew -Pversion="$VERSION" :composeApp:packageDeb --no-daemon || {
            echo "===== jpackage stderr 日志 ====="
            cat composeApp/build/compose/logs/packageDeb/*-err.txt 2>/dev/null || true
            exit 1
          }

      - name: Upload DEB
        uses: actions/upload-artifact@v4
        with:
          name: linux-deb
          path: source/composeApp/build/compose/binaries/main/deb/*.deb
          if-no-files-found: error

      - name: Upload DEB to GitHub Release
        if: needs.resolve-version.outputs.tag != 'main'
        working-directory: source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ needs.resolve-version.outputs.tag }}" \
            composeApp/build/compose/binaries/main/deb/*.deb \
            --repo "${{ github.repository }}" --clobber